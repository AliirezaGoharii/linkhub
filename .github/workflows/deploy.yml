name: Deploy to Hugging Face Space

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Convert all binaries to LFS
        run: |
          git lfs install
          git config user.email "github-actions@users.noreply.github.com"
          git config user.name "GitHub Actions"
          # این دستور تمام فایل‌های باینری را در کل تاریخچه به LFS تبدیل می‌کند
          git lfs migrate import --yes --everything --include="*.png,*.jpg,*.jpeg,*.gif,*.webp,*.mp4,*.mov,*.pdf,*.pkl"

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add space https://aliirezagoharii:$HF_TOKEN@huggingface.co/spaces/aliirezagoharii/linkhub
          git push --force space main
